services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: job_searcher
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: job_searcher_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_searcher -d job_searcher_test"]
      interval: 2s
      timeout: 3s
      retries: 20
