name: Multiuser Quality
on:
  workflow_call:
permissions:
  contents: read
env:
  PIP_DEFAULT_TIMEOUT: '60'
  PIP_RETRIES: '5'
defaults:
  run:
    working-directory: multiuser
jobs:
  quality-multiuser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: job_searcher
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: job_searcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_searcher -d job_searcher_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      QA_TEST_DATABASE_URL: postgresql://job_searcher:local-test-only@127.0.0.1:5432/job_searcher_test
      QA_LOAD_REPORT: /tmp/job-stage9-load.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: multiuser/frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: npm ci
        working-directory: multiuser/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: multiuser/frontend
      - run: python -m qa_job_bot.quality
        env:
          PYTHONPATH: src
          QA_E2E_PYTHON: python
          QA_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: python ../ci/results.py .
      - run: POSTGRES_PASSWORD=ci-synthetic-only docker compose -f compose.runtime.yaml config --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          retention-days: 7
          name: multiuser-quality-reports
          path: |
            multiuser/coverage.json
            multiuser/coverage.xml
            multiuser/test-results/backend.xml
            multiuser/frontend/coverage/
            multiuser/frontend/playwright-report/
            multiuser/frontend/test-results/
            /tmp/job-stage9-load.json
  runtime-compose-multiuser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: docker build -f Dockerfile.runtime -t job-searcher-runtime:local .
      - run: python tests/runtime_rehearsal.py
        env:
          PYTHONPATH: ..
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          retention-days: 7
          name: multiuser-runtime-compose-report
          path: /tmp/job-stage9-compose.json
