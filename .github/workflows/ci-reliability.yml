name: CI reliability
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
      - run: python ci/reliability.py
        env:
          GH_TOKEN: ${{ github.token }}
