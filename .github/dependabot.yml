version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directories: [/frontend, /multiuser/frontend, /ci]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend-toolchain:
        patterns: [vite, '@vitejs/*', vitest, '@vitest/*']
      npm-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: pip
    directories: [/, /multiuser, /ci]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ['*']
